# 中国卖家禁售 / 本系统主动排除的品类
# L1 阶段只做 Amazon 路径/title 关键词硬拦 (excluded_categories)
# L2 R2 阶段做 9 大禁售大类 (mega_forbidden_categories, 基于 walmart_product_type 匹配)
#
# 匹配规则:
#   - excluded_categories: scope ∈ {amazon_category, walmart_pt, title_keyword} 子串 (大小写不敏感)
#   - mega_forbidden_categories.pt_contains: walmart_product_type 子串 (大小写不敏感, 任一命中)
#   - mega_forbidden_categories.walmart_category_prefix: walmart_category_map.raw->>'walmart_category' 前缀

version: 2
updated: 2026-04-20

# -------- L1 硬禁 (Amazon 路径 / title 关键词) --------
excluded_categories:
  # --- 3C 电子 (带电产品, 搬运搞不定) ---
  - match: "Consumer Electronics"
    scope: amazon_category
    reason: 3C 禁售
  - match: "Laptops"
    scope: walmart_pt
    reason: 3C 禁售
  - match: "Headphones"
    scope: walmart_pt
    reason: 3C 禁售
  - match: "Smartwatches"
    scope: walmart_pt
    reason: 3C 禁售
  - match: "Cell Phone"
    scope: walmart_pt
    reason: 3C 禁售
  - match: "Tablets"
    scope: walmart_pt
    reason: 3C 禁售

  # --- 服饰 ---
  - match: "Clothing"
    scope: amazon_category
    reason: 服饰禁售
  - match: "Apparel"
    scope: walmart_pt
    reason: 服饰禁售
  - match: "Shoes"
    scope: amazon_category
    reason: 服饰禁售(鞋)

  # --- 汽配 ---
  - match: "Automotive Parts"
    scope: walmart_pt
    reason: 汽配禁售
  - match: "Auto Parts"
    scope: amazon_category
    reason: 汽配禁售
  - match: "Car Accessories"
    scope: walmart_pt
    reason: 汽配禁售

  # --- 带电产品 (title 关键词) ---
  # 用户决定放松硬禁 (2026-04-21): 带电判定交给 L3 LLM 语义, 这里只保留最确定的整机电池类
  # 原来的 Battery / Rechargeable / Lithium 会硬拦 "No Battery 配件" / "LED 装饰灯" 等误判
  # - match: "Battery"           scope: title_keyword  (放松, 交 L3)
  # - match: "Rechargeable"      scope: title_keyword  (放松, 交 L3)
  # - match: "Lithium"           scope: title_keyword  (放松, 交 L3)
  - match: "Power Bank"
    scope: walmart_pt
    reason: 带电产品禁售


# -------- L2 R2 禁售大类 (基于判定后的 Walmart PT) --------
# 命中任一 key 即 R2 触发, -100, stage_stopped_at=L2
#
# 每个 key 的命中策略 (任一满足即命中):
#   - pt_contains: walmart_product_type 包含任一关键词 (不区分大小写)
#   - walmart_category_prefix: walmart_category_map.raw['walmart_category'] 以任一前缀开头
#
# 关键词按沃尔玛官方 PT 字典的常见命名选择, 保守策略: 宁可漏不可错杀
#
# 顺序 = 优先级 (先命中先生效). 把更"具体"的类目 (medical / pet_food) 排在更"泛"的前面 (electronics / food)
# 以避免 "Blood Pressure Monitor" 被 electronics.Monitor 先命中这种 bug.
mega_forbidden_categories:
  # --- 高优先 (更具体) ---
  - key: medical
    reason: "医疗器械禁售: FDA 510(k) 许可"
    pt_contains:
      - "Medical Device"
      - "Diagnostic"
      - "Hearing Aid"
      - "Therapeutic"
      - "Surgical"
      - "Blood Pressure Monitor"
      - "Glucose Meter"
      - "Thermometer"
      - "Pulse Oximeter"
      - "Nebulizer"
      - "CPAP"
      - "Syringe"
      - "Prescription"
      - "OTC Drug"
      - "Pharmaceutical"
    walmart_category_prefix:
      - "Health"
      - "Medical"

  - key: pet_food
    reason: "宠物食品禁售: FDA 宠物食品设施注册 + AAFCO 标签"
    pt_contains:
      - "Pet Food"
      - "Dog Food"
      - "Cat Food"
      - "Bird Food"
      - "Fish Food"
      - "Pet Treat"
      - "Dog Treat"
      - "Cat Treat"
      - "Pet Supplement"
      - "Pet Vitamin"
    walmart_category_prefix:
      - "Pet Food"

  - key: baby
    reason: "婴童用品禁售: CPSIA/JPMA 认证 + 食品接触合规"
    pt_contains:
      - "Baby"
      - "Infant"
      - "Toddler"
      - "Crib"
      - "Bassinet"
      - "High Chair"
      - "Stroller"
      - "Car Seat"
      - "Diaper"
      - "Pacifier"
      - "Baby Bottle"
      - "Breast Pump"
      - "Nursing"
      - "Teether"
    walmart_category_prefix:
      - "Baby"

  - key: children_toys
    reason: "儿童用品禁售: CPC/CPSIA 测试报告强制"
    pt_contains:
      - "Children"
      - "Kids Toy"
      - "Toy Vehicle"
      - "Toy Figure"
      - "Doll"
      - "Stuffed Animal"
      - "Plush"
      - "Action Figure"
      - "Board Game"
      - "Puzzle"
      - "Building Block"
      - "Toy Gun"
      - "Toy Weapon"
    walmart_category_prefix:
      - "Toys"
      - "Games & Toys"

  - key: cosmetics
    reason: "化妆品禁售: FDA 化妆品合规 + 成分披露"
    pt_contains:
      - "Cosmetic"
      - "Makeup"
      - "Lipstick"
      - "Lip Gloss"
      - "Mascara"
      - "Eyeliner"
      - "Eyeshadow"
      - "Foundation Makeup"
      - "Blush"
      - "Nail Polish"
      - "Skincare"
      - "Facial Treatment"
      - "Anti Aging"
      - "Sunscreen"
      - "Perfume"
      - "Fragrance"
      - "Hair Dye"
      - "Hair Color"
    walmart_category_prefix:
      - "Beauty"

  # --- 中优先 (大类) ---
  - key: automotive
    reason: "汽配禁售: DOT/SAE 认证 + 安全件责任"
    pt_contains:
      - "Automotive"
      - "Auto Parts"
      - "Car Battery"
      - "Brake Pad"
      - "Brake Rotor"
      - "Tire"
      # "Wheel": 去掉, 太泛 (Material Handling Wheel / Abrasive Wheel / Sliding Gate Wheel 都会误中)
      # 改为更具体的
      - "Car Wheel"
      - "Steering Wheel"
      - "Wheel Cover"
      - "Hubcap"
      - "Engine"
      - "Transmission"
      - "Airbag"
      - "Seat Belt"
      - "Car Seat"
      - "Motor Oil"
      - "Vehicle Lighting"
      - "Headlight"
      - "Taillight"
    walmart_category_prefix:
      - "Automotive"
      - "Auto & Tires"

  - key: electronics
    reason: "电子产品禁售: NRTL/FCC 认证要求, 搬运无法提供"
    pt_contains:
      - "Laptop"
      - "Desktop Computer"
      - "Tablet Computer"
      - "Cell Phone"
      - "Smartphone"
      - "Smartwatch"
      - "Headphone"
      - "Earbud"
      # "Speaker": 去掉, 太泛 (蓝牙音箱≠音箱主体)
      - "Television"
      - "Computer Monitor"     # 收窄, 避免命中 Blood Pressure Monitor
      - "LCD Monitor"
      - "Projector"
      - "Camera"
      - "Camcorder"
      - "Drone"
      - "Game Console"
      - "Router"
      - "Modem"
      - "Network Switch"
      - "Smart Home"
      - "Power Bank"
      - "Portable Charger"
    # walmart_category_prefix: 去掉 - 'Electronics' 下很多 PT 是配件 (Port Dust Covers 等)
    # 可以做, 不应该被兜底拦掉. 只依赖 pt_contains 精确关键词
    walmart_category_prefix: []

  - key: apparel
    reason: "服饰禁售: 尺码/SKU管理复杂, 退货率高, 中国卖家难做"
    pt_contains:
      - "Apparel"
      - "Clothing"
      - "Shirt"
      - "Pants"
      - "Jeans"
      - "Dress"
      # "Skirt": 去掉, 会误中 "Christmas Tree Skirts" / "Deck Skirt" 装饰类
      - "Sweater"
      - "Jacket"
      - "Coat"
      - "Suit"
      - "Swimwear"
      - "Underwear"
      - "Lingerie"
      - "Bra"
      - "Sock"
      - "Hosiery"
      - "Footwear"
      - "Sneaker"
      - "Boot"
      - "Sandal"
      - "Slipper"
      - "Hat"
      # "Cap": 去掉, 会误中 "Bottle Cap" / "Wheel Cap" / "Lens Cap"
      - "Scarf"
      - "Glove"
      - "Uniform"
    walmart_category_prefix:
      - "Clothing"
      - "Apparel"
      - "Shoes"

  # --- 兜底 (最泛) ---
  - key: food
    reason: "食品禁售: FDA 食品设施注册 + 标签合规"
    pt_contains:
      - "Food"
      - "Beverage"
      - "Grocery"
      - "Snack"
      - "Cereal"
      - "Condiment"
      - "Candy"
      - "Chocolate"
      - "Coffee"
      - "Tea Bag"
      - "Juice"
      - "Soda"
      - "Wine"
      - "Beer"
      - "Liquor"
      - "Sauce"
      - "Spice"
      - "Dairy"
      - "Meat"
      - "Seafood"
      - "Frozen Food"
    walmart_category_prefix:
      - "Food"
      - "Grocery"
